name: Deploy to GitHub Pages

on:
  push:
    branches: "main" # או master, תלוי איך קוראים לבראנץ' הראשי שלך

# הגדרת הרשאות ל-GitHub Actions כדי שיוכל לפרסם את האתר
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # תיקנתי כאן קלות מ-node-level ל-node-version הסטנדרטי
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        # כאן קורה הקסם - אנחנו מזריקים את ה-Secrets שהגדרת ב-GitHub לתוך ה-Build של Vite
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist" # התיקייה שבה נמצאים הקבצים המוכנים

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
